<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Business Card Ad</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .card {
        width: 500px;   /* 50 units */
        height: 300px;  /* 30 units */
        display: flex;
        border: 1px solid #ccc;
    }

    /* LEFT SIDE */
    .left {
        width: 50%;
        background: white;
        padding: 20px;
        position: relative;
    }

    .print {
        font-size: 13px;
        color: #777; /* not dark */
        margin-top: 10px;
    }

    .title {
        font-size: 18px;
        font-weight: bold;
        margin-top: 5px;
        margin-bottom: 25px; /* reduced to 2 lines spacing */
    }

    ul {
        list-style: disc;
        padding-left: 20px;
        font-size: 14px;
    }

    ul li {
        margin-bottom: 10px;
    }

    /* toggle button */
    .toggle {
        display: inline-block;
        width: 40px;
        height: 20px;
        background: #1e6fff;
        border-radius: 20px;
        position: relative;
        margin-left: 10px;
    }

    .toggle::after {
        content: "";
        width: 16px;
        height: 16px;
        background: white;
        position: absolute;
        top: 2px;
        right: 2px;
        border-radius: 50%;
    }

    /* RIGHT SIDE */
    .right {
        width: 50%;
        background: url('https://images.unsplash.com/photo-1586075010923-2dd4570fb338') center/cover;
        position: relative;
    }

    /* NEW badge */
    .badge {
        position: absolute;
        top: -10px;
        left: -20px; /* sits on dividing line */
        width: 50px;
        height: 50px;
        background: green;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
    }

</style>
</head>
<body>

<div class="card">
    
    <div class="left">
        <div class="print">print</div>
        <div class="title">Business Cards</div>

        <ul>
            <li>High Quality Printing</li>
            <li>Premium Card Stock</li>
            <li>Full Color Printing</li>
            <li>Matte & Glossy Finish</li>
            <li>Custom Designs</li>
            <li>Fast Turnaround</li>
            <li>Properties <span class="toggle"></span></li>
        </ul>
    </div>

    <div class="right">
        <div class="badge">new</div>
    </div>

</div>

</body>
</html>
