<!DOCTYPE html>
<html>
    <head>
        <title>Api loading example</title>

        <style></style>
        
    </head>
    <body>
        <h1>Recipe data</h1>
        <div id="box" class="loading">loading...</div>
        <script>
            async function getdata(){
                let box=document.getElementById("box")
                let response=await fetch("https://dummyjson.com/recipes")

                let data=await response.json()

                box.innerhtml=""

                data.recipe.foreach(function(item){
                    box.innerhtml +=`
                        <div class="card">
                            <img src="$(item.image)">
                            <h2>$(item.name)</h2>
                            <p>$(item.cuisine)</p>
                            <p>$(item.rating)</p>
                        </div>
                    `;
                })
            }
            </script>
    </body>
</html>
